[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atmoph-window-remote"
version = "0.1.0"
description = "Local BLE control for Atmoph Window 2 in Home Assistant"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "disruptivepatternmaterial" }]
dependencies = [
  "bleak>=1.1.1",
  "bleak-retry-connector>=4.6.3",
]

[project.optional-dependencies]
# Lint and the protocol test suite. Deliberately free of Home Assistant:
# importing it would pull in the USB and serial stacks that
# homeassistant.components.bluetooth depends on, for no test coverage gain.
dev = [
  "pytest>=9.0.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]
# Only needed to type-check or run the Home Assistant facing modules locally.
# Home Assistant installs these itself at runtime.
homeassistant = [
  "homeassistant>=2026.8.0",
]
# The Home Assistant layer suite in tests/homeassistant/. Every release of
# pytest-homeassistant-custom-component pins one exact Home Assistant version,
# so this pins the harness rather than Home Assistant itself.
#
# aiousbwatcher and serialx are requirements of the `usb` integration, which
# `homeassistant.components.bluetooth` depends on. Home Assistant installs a
# component's requirements when it sets the component up, so `pip install
# homeassistant` alone leaves the import of `bluetooth` failing.
homeassistant-test = [
  "pytest-homeassistant-custom-component==0.13.357",
  "bleak-retry-connector>=4.6.3",
  "aiousbwatcher==1.1.2",
  "serialx==1.8.2",
]

# The repository is a Home Assistant custom component, not a library: it ships
# as the HACS zip, and both test suites import it from the checkout through
# pytest's pythonpath. Packaging nothing keeps `pip install -e .` to metadata
# and the extras, which is all it is ever used for. Claiming
# `custom_components` would instead put setuptools' editable finder into
# `custom_components.__path__`, and Home Assistant's custom component scan
# lists every entry there as a directory.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Import the integration from the checkout so the protocol tests run without
# installing the package.
pythonpath = ["."]
# tests/homeassistant/ needs the real package and Home Assistant imported;
# tests/test_protocol.py asserts the opposite. Keeping the directory out of
# recursive discovery leaves `pytest` as the fast, Home Assistant free suite
# while `pytest tests/homeassistant` still runs on request. See
# tests/homeassistant/__init__.py.
norecursedirs = ["homeassistant", "*.egg", ".*", "build", "dist", "node_modules"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
